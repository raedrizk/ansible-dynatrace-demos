---
- name: install one agent
  hosts: all
  become: true
  vars:
    dynatrace_environment_url: "{{ dynatrace_url }}"
    dynatrace_paas_token: "{{ dynatrace_token }}"
  tasks:
  - name: make sure wget is available
    ansible.builtin.dnf:
      name: wget
      state: latest

  - name: Download the installer using this command on the target host
    ansible.builtin.command: |
                          wget -O Dynatrace-OneAgent-Linux-1.307.55.20250213-112657.sh "https://{{ dynatrace_url }}/api/v1/deployment/installer/agent/unix/default/latest?arch=x86" --header="Authorization: Api-Token {{ dynatrace_token }}"
   # no_log: true

  - name: Run the installer with root rights
    ansible.builtin.command: /bin/sh Dynatrace-OneAgent-Linux-1.307.55.20250213-112657.sh --set-monitoring-mode=fullstack --set-app-log-content-access=true --set-host-name={{ inventory_hostname }} --set-host-group=Foxhound -set-host-tag="environment=Foxhound"
